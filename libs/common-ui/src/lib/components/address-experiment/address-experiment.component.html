<app-tt-input

        [formControl]="innerSearchControl"
></app-tt-input>

@if (suggestions$ | async; as suggestions) {
    @if (isDropdownOpened()) {
        <div class="suggestions-dropdown">

            @for (suggest of suggestions; track suggest) {
                <button class="suggest-btn"
                        (click)="onSuggestionPick(suggest)">{{ suggest.data.city}} {{ suggest.data.street}} {{ suggest.data.house}}</button>        }

</div>
    }
}

<div class="wrapper" [formGroup]="formGroup">
    <app-tt-input formControlName="city">Город</app-tt-input>
    <app-tt-input formControlName="street">Улица</app-tt-input>
    <app-tt-input formControlName="building">Дом</app-tt-input>
    <app-tt-input formControlName="apartment">Квартира</app-tt-input>
</div>
